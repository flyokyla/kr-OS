# /etc/nginx/sites-available/kros
# HTTPS на порту 8443 (самоподписанный сертификат, доступ по IP).
# Не трогает существующие 80/443 сайты.

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/kros/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kros/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/kros.access.log;
    error_log  /var/log/nginx/kros.error.log;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
